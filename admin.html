<!DOCTYPE html>
<html lang="pt-br">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestão de Usuários</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="container">
        <a href="index.html" class="logo">SheCodes</a>
        <ul class="nav-links">
            <li><a href="index.html">Voltar ao Início</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="form-page">
        <div class="form-container">

            <h2>Painel Administrativo</h2>
            <p>Gerencie usuários cadastrados localmente.</p>

            <div class="form-group">
                <label for="nome">Nome do usuário</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite o e-mail">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="cadastrar()" class="cta-button">Cadastrar</button>
                <button onclick="limparCampos()" class="cta-button" style="background:transparent; border: 1px solid #7f5af0;">Limpar</button>
            </div>

            <hr style="margin: 30px 0; border-color: #3a314d;">

            <h3>Pesquisar</h3>
            <div class="form-group">
                <input type="text" id="pesquisa" placeholder="Pesquise por nome ou e-mail" oninput="pesquisar()">
            </div>

            <h3 style="margin-top: 20px;">Usuários cadastrados</h3>
            <ul id="listaUsuarios" style="list-style: none; padding: 0;"></ul>

            <button onclick="excluirTodos()" class="cta-button" style="background:#ff4d4d; border-color: #ff4d4d; margin-top:20px;">Excluir Todos</button>

        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2025 SheCodes.</p>
    </div>
</footer>

<script src="./js/admin.js"></script>
</body>
</html>
