<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestão de Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="container">
        <a href="index.html" class="logo">SheCodes</a>
        <ul>
            <li><a href="index.html#sobre">Sobre</a></li>
            <li><a href="index.html#mentoras">Encontrar Mentora</a></li>
            <li><a href="form.html">Inscreva-se</a></li>
            <li><a href="admin.html" class="cta-button nav-button">Admin</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="form-page">
        <div class="form-container">

            <h2>Painel Administrativo</h2>
            <p>Gerencie usuários cadastrados localmente.</p>

            <div class="form-group">
                <label for="nome">Nome do usuário</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite o e-mail">
            </div>

            <button onclick="cadastrar()" class="cta-button">Cadastrar</button>
            <button onclick="limparCampos()" class="cta-button" style="background:#666;">Limpar</button>

            <hr style="margin: 30px 0;">

            <h3>Pesquisar</h3>
            <input type="text" id="pesquisa" placeholder="Pesquise por nome ou e-mail" oninput="pesquisar()">

            <h3 style="margin-top: 20px;">Usuários cadastrados</h3>
            <ul id="listaUsuarios"></ul>

            <button onclick="excluirTodos()" class="cta-button" style="background:red; margin-top:20px;">Excluir Todos</button>

        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2025 SheCodes. Todos os direitos reservados.</p>
    </div>
</footer>

<script src="admin.js"></script>
</body>
</html>
