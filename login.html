<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SheCodes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="container">
            <a href="index.html" class="logo">SheCodes</a>
            <ul>
                <li><a href="index.html">Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-page">
            <div class="form-container">
                <h2>Bem-vinda de volta!</h2>
                <p>Acesse sua conta para agendar mentorias.</p>
                
                <form> 
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seuemail@dominio.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Sua senha">
                    </div>

                    <button type="button" class="cta-button" onclick="alert('Login simulado com sucesso!')">Entrar</button>
                </form>
                
                <p class="login-link">
                    Ainda não tem conta? <a href="form.html">Cadastre-se aqui</a>.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 SheCodes.</p>
        </div>
    </footer>

</body>
</html>
