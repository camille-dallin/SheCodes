<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SheCodes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="container">
            <a href="index.html" class="logo">SheCodes</a>
            <ul>
                <li><a href="index.html">Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-page">
            <div class="form-container">
                <h2>Bem-vinda de volta!</h2>
                <p>Acesse sua conta para agendar mentorias.</p>
                
                <form onsubmit="fazerLogin(event)"> 
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seuemail@dominio.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Sua senha" required>
                    </div>

                    <button type="submit" class="cta-button">Entrar</button>
                </form>
                
                <p class="login-link">
                    Ainda não tem conta? <a href="form.html">Cadastre-se aqui</a>.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 SheCodes.</p>
        </div>
    </footer>

    <script>
        function fazerLogin(event) {
            event.preventDefault();
            // Simulação de verificação
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            if(email && senha) {
                alert("Login realizado com sucesso! Vamos encontrar sua mentora.");
                // Redireciona para a seção de mentoras na home
                window.location.href = "index.html#mentoras"; 
            } else {
                alert("Preencha todos os campos.");
            }
        }
    </script>
</body>
</html>
