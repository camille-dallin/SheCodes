<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - SheCodes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">SheCodes</a>
            <ul>
                <li><a href="index.html#sobre">Sobre</a></li>
                <li><a href="index.html#mentoras">Encontrar Mentora</a></li>
                <li><a href="form.html">Inscreva-se</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-page">
            <div class="form-container">
                <h2>Crie sua conta</h2>
                <p>Junte-se à comunidade SheCodes como mentorada ou mentora.</p>
                
                <form id="formCadastro">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" required minlength="8">
                    </div>
                    
                    <div class="form-group">
                        <label for="area">Área de Interesse</label>
                        <select id="area" name="area" required>
                            <option value="">Selecione sua área principal</option>
                            <option value="frontend">Front-End</option>
                            <option value="backend">Back-End</option>
                            <option value="uiux">UI/UX Design</option>
                        </select>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos">Eu li e aceito os <a href="#">Termos de Uso</a>.</label>
                    </div>

                    <button type="submit" class="cta-button">Cadastrar</button>
                </form>
                
                <p class="login-link">
                    Já tem uma conta? <a href="login.html">Faça login aqui</a>.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 SheCodes.</p>
        </div>
    </footer>

    <script src="cadastro.js"></script>
</body>
</html>
